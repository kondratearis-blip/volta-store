name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build:android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../HunterQuest-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HunterQuest-${{ env.VERSION_NAME }}
          path: HunterQuest-*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Hunter Quest ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: HunterQuest-*.apk
          body: |
            Установка на Android: скачай APK на телефон, открой файл и разреши установку из этого источника.
            Новая версия ставится поверх старой, прогресс сохраняется.
