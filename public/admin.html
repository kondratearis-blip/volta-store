<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kokoro — заказы</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<style>
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  .logo span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .login { max-width: 340px; margin: 18vh auto; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 16px; }
  .filters input[type=date] { width: auto; padding: 7px 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--text); font-weight: 600; }
  .chip b { color: var(--muted); font-weight: 500; margin-left: 4px; }

  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding-bottom: 40px; }
  .order { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .order.is-new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .order .head { display: flex; justify-content: space-between; align-items: baseline; }
  .order .num { font-size: 20px; font-weight: 800; }
  .order ul { margin: 0; padding-left: 18px; }
  .order .sum { font-weight: 700; }
  .order .kv { font-size: 14px; display: grid; gap: 2px; }
  .order .kv b { font-weight: 600; }
  .order .kv a { color: inherit; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .badge.new { background: var(--accent); color: #fff; }
  .badge.done { color: var(--ok); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn { flex: 1; padding: 9px 12px; font-size: 14px; }
  .wa { background: #25d366 !important; border-color: #25d366 !important; color: #fff !important; }
  .order select { padding: 8px 10px; font-size: 14px; }
  .order textarea { font-size: 14px; padding: 8px 10px; }

  .menu-list { display: grid; gap: 10px; }
  .mi { display: grid; grid-template-columns: 88px 1fr; gap: 12px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); }
  .mi.off { opacity: .55; }
  .mi .pic { width: 88px; height: 88px; border-radius: 10px; background: var(--soft) center / cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; cursor: pointer; text-align: center; }
  .mi .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mi .field { margin: 0; }
  .mi .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .mi .tools label { display: flex; gap: 6px; align-items: center; font-size: 14px; margin-right: auto; }
  .mi .tools input[type=checkbox] { width: auto; }
  .icon { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); margin-top: 12px; }
  .savebar .status { font-size: 14px; color: var(--muted); }

  .settings { max-width: 560px; padding-bottom: 40px; }
  .settings .check { display: flex; gap: 10px; align-items: center; margin: 8px 0 14px; }
  .settings .check input { width: auto; }
  .qrprev { width: 180px; border-radius: 10px; border: 1px solid var(--line); display: block; margin: 8px 0; background: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
  @media (max-width: 520px) { .mi { grid-template-columns: 1fr; } .mi .pic { width: 100%; height: 140px; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="loginView" class="login" hidden>
    <div class="logo">Kokoro<span>.</span> админка</div>
    <form id="loginForm">
      <label class="field" style="margin-top:16px"><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="error" id="loginError"></p>
      <button class="btn primary block">Войти</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <div class="logo">Kokoro<span>.</span></div>
      <nav class="tabs">
        <button data-tab="orders" class="active">Заказы</button>
        <button data-tab="menu">Меню</button>
        <button data-tab="settings">Настройки</button>
      </nav>
      <button class="btn small" id="logout">Выйти</button>
    </div>

    <div id="tab-orders">
      <div class="filters">
        <input type="date" id="day">
        <span id="statusFilters"></span>
        <button class="chip" id="sound" title="Звук при новом заказе">🔔 Звук</button>
      </div>
      <div class="orders" id="orders"></div>
    </div>

    <div id="tab-menu" hidden>
      <p class="muted">Позиции меню: фото, название, категория, состав, цена. Снимите «В продаже», если позиция закончилась.</p>
      <div class="menu-list" id="menuList"></div>
      <div class="savebar">
        <button class="btn" id="addItem">+ Позиция</button>
        <button class="btn primary" id="saveMenu">Сохранить меню</button>
        <span class="status" id="menuStatus"></span>
      </div>
    </div>

    <div id="tab-settings" hidden>
      <form class="settings" id="settingsForm">
        <label class="check"><input type="checkbox" name="acceptingOrders"> Принимать заказы на сайте</label>
        <label class="field"><span>Текст, когда заказы закрыты</span><input name="closedMessage" maxlength="300"></label>
        <label class="field"><span>Стоимость доставки, сом (0 — бесплатно)</span><input name="deliveryFee" type="number" min="0"></label>
        <label class="field"><span>Минимальная сумма заказа, сом</span><input name="minOrder" type="number" min="0"></label>

        <label class="field"><span>QR-код для оплаты</span></label>
        <img class="qrprev" id="qrPreview" alt="QR-код" hidden>
        <input type="file" id="qrFile" accept="image/*">
        <p class="hint">Показывается клиенту сразу после оформления заказа.</p>
        <label class="field"><span>Текст под QR-кодом</span><textarea name="qrNote" rows="2" maxlength="500"></textarea></label>

        <label class="field"><span>Шаблон сообщения в WhatsApp</span><textarea name="whatsappTemplate" rows="6" maxlength="1000"></textarea></label>
        <p class="hint">Подстановки: {number} {name} {items} {total} {address} {time}</p>
        <button class="btn primary">Сохранить настройки</button>
        <span class="muted" id="settingsStatus"></span>
      </form>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => n.toLocaleString("ru-RU") + " сом";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS = { new: "Новый", confirmed: "Подтверждён", cooking: "Готовится", delivering: "В пути", done: "Доставлен", canceled: "Отменён" };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

let token = store.get("kokoro-admin-token");
let settings = null;
let orders = [];
let filter = "active";
let knownIds = null;
let soundOn = store.get("kokoro-sound") !== "off";
let pollTimer;

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    ...opts,
    headers: { ...(opts.body && !(opts.body instanceof Blob) ? { "content-type": "application/json" } : {}), ...opts.headers, authorization: "Bearer " + token },
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/admin/login") { logout(); throw new Error("Требуется вход"); }
  if (!res.ok) throw new Error(data.error || "Ошибка " + res.status);
  return data;
}

function todayBishkek() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bishkek" }).format(new Date()); }

function showLogin() { $("#loginView").hidden = false; $("#app").hidden = true; clearInterval(pollTimer); }
function logout() { token = null; store.set("kokoro-admin-token", null); showLogin(); }

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginError").textContent = "";
  try {
    const res = await fetch("/api/admin/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: e.target.password.value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    token = data.token;
    store.set("kokoro-admin-token", token);
    start();
  } catch (ex) { $("#loginError").textContent = ex.message || "Ошибка входа"; }
});
$("#logout").addEventListener("click", logout);

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
  for (const t of ["orders", "menu", "settings"]) $("#tab-" + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === "menu") loadMenu();
  if (b.dataset.tab === "settings") fillSettings();
}));

async function start() {
  $("#loginView").hidden = true;
  $("#app").hidden = false;
  $("#day").value = todayBishkek();
  updateSoundBtn();
  try { settings = await api("/admin/settings"); } catch { return; }
  await loadOrders();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, 10000);
}

/* ---------- Orders ---------- */
$("#day").addEventListener("change", () => { knownIds = null; loadOrders(); });

async function loadOrders() {
  let data;
  try { data = await api("/admin/orders?day=" + $("#day").value); } catch { return; }
  const fresh = knownIds ? data.orders.filter((o) => !knownIds.has(o.id)) : [];
  knownIds = new Set(data.orders.map((o) => o.id));
  orders = data.orders;
  if (fresh.length) notifyNew(fresh.length);
  renderOrders();
}

const isActive = (o) => !["done", "canceled"].includes(o.status);
function renderOrders() {
  const counts = { active: orders.filter(isActive).length, all: orders.length };
  for (const s of Object.keys(STATUS)) counts[s] = orders.filter((o) => o.status === s).length;
  const chips = [["active", "Активные"], ["all", "Все"], ...Object.entries(STATUS)];
  $("#statusFilters").innerHTML = chips.map(([k, label]) => `<button class="chip ${filter === k ? "active" : ""}" data-filter="${k}">${label}<b>${counts[k]}</b></button>`).join(" ");

  const list = orders.filter((o) => filter === "all" || (filter === "active" ? isActive(o) : o.status === filter));
  // Oldest active first so the queue is worked top-down; finished orders newest first
  if (filter === "active") list.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
  const editing = document.activeElement?.closest?.(".order")?.dataset.id;
  if (editing) return; // don't wipe a note the manager is typing
  $("#orders").innerHTML = list.length ? list.map(orderHtml).join("") : '<p class="muted">Заказов нет</p>';
}

function waLink(o) {
  let d = o.customer.phone.replace(/\D/g, "");
  if (d.length === 10 && d.startsWith("0")) d = "996" + d.slice(1);
  else if (d.length === 9) d = "996" + d;
  const vars = {
    number: o.number, name: o.customer.name, total: o.total.toLocaleString("ru-RU"),
    items: o.items.map((i) => `• ${i.name} × ${i.qty}`).join("\n"),
    address: fullAddress(o.customer), time: o.customer.time,
  };
  const text = (settings?.whatsappTemplate || "").replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

function fullAddress(c) {
  return [c.address, c.entrance && "подъезд " + c.entrance, c.floor && "этаж " + c.floor, c.apartment && "кв. " + c.apartment].filter(Boolean).join(", ");
}

function orderHtml(o) {
  const t = new Date(o.createdAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bishkek" });
  const c = o.customer;
  return `<article class="order ${o.status === "new" ? "is-new" : ""}" data-id="${esc(o.id)}">
    <div class="head"><span class="num">№ ${o.number}</span><span class="muted">${t}</span><span class="badge ${o.status}">${STATUS[o.status]}</span></div>
    <ul>${o.items.map((i) => `<li>${esc(i.name)} × ${i.qty} <span class="muted">— ${money(i.price * i.qty)}</span></li>`).join("")}</ul>
    <div class="sum">Итого: ${money(o.total)}${o.deliveryFee ? ` <span class="muted">(доставка ${money(o.deliveryFee)})</span>` : ""}</div>
    <div class="kv">
      <div><b>${esc(c.name)}</b> · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>
      <div>${esc(fullAddress(c))}</div>
      <div class="muted">${esc(c.time)}</div>
      ${c.comment ? `<div>💬 ${esc(c.comment)}</div>` : ""}
    </div>
    <div class="actions">
      <a class="btn wa" href="${esc(waLink(o))}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" href="tel:${esc(c.phone)}">Позвонить</a>
    </div>
    <select data-status>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? "selected" : ""}>${v}</option>`).join("")}</select>
    <textarea data-note rows="1" placeholder="Заметка менеджера">${esc(o.managerNote)}</textarea>
  </article>`;
}

$("#statusFilters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (b) { filter = b.dataset.filter; renderOrders(); }
});
$("#orders").addEventListener("change", async (e) => {
  const card = e.target.closest(".order");
  if (!card) return;
  const body = e.target.matches("[data-status]") ? { status: e.target.value } : e.target.matches("[data-note]") ? { managerNote: e.target.value } : null;
  if (!body) return;
  try {
    const updated = await api("/admin/orders?id=" + encodeURIComponent(card.dataset.id), { method: "PATCH", body: JSON.stringify(body) });
    orders = orders.map((o) => (o.id === updated.id ? updated : o));
    e.target.blur();
    renderOrders();
  } catch (ex) { alert(ex.message); }
});

let audioCtx;
function beep() {
  try {
    audioCtx ??= new AudioContext();
    [0, 0.25, 0.5].forEach((t) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
    });
  } catch {}
}
function notifyNew(n) {
  if (soundOn) beep();
  let flips = 0;
  const base = "Kokoro — заказы";
  const timer = setInterval(() => {
    document.title = flips++ % 2 ? base : `🔴 Новый заказ (${n})`;
    if (flips > 20 || document.hasFocus()) { clearInterval(timer); document.title = base; }
  }, 800);
}
function updateSoundBtn() { $("#sound").classList.toggle("active", soundOn); $("#sound").textContent = soundOn ? "🔔 Звук вкл." : "🔕 Звук выкл."; }
$("#sound").addEventListener("click", () => {
  soundOn = !soundOn;
  store.set("kokoro-sound", soundOn ? "on" : "off");
  updateSoundBtn();
  if (soundOn) beep(); // also unlocks audio in the browser after a user gesture
});

/* ---------- Menu ---------- */
let menu = [];
async function loadMenu() {
  try { menu = await api("/admin/menu"); } catch { return; }
  renderMenu();
}
function renderMenu() {
  $("#menuList").innerHTML = menu.length ? menu.map((m, i) => `
    <div class="mi ${m.available ? "" : "off"}" data-i="${i}">
      <label class="pic" style="${m.image ? `background-image:url('${esc(m.image)}')` : ""}">${m.image ? "" : "Добавить<br>фото"}<input type="file" accept="image/*" data-img hidden></label>
      <div>
        <div class="grid2">
          <label class="field"><span>Название</span><input data-k="name" value="${esc(m.name)}"></label>
          <label class="field"><span>Категория</span><input data-k="category" value="${esc(m.category)}" list="cats"></label>
        </div>
        <label class="field" style="margin-top:8px"><span>Состав / описание</span><textarea data-k="description" rows="2">${esc(m.description)}</textarea></label>
        <div class="tools">
          <label><input type="checkbox" data-k="available" ${m.available ? "checked" : ""}> В продаже</label>
          <input data-k="price" type="number" min="0" value="${m.price}" style="width:110px" aria-label="Цена"> <span class="muted">сом</span>
          <button class="icon" data-move="-1" title="Выше">↑</button>
          <button class="icon" data-move="1" title="Ниже">↓</button>
          <button class="icon" data-del title="Удалить">✕</button>
        </div>
      </div>
    </div>`).join("") + `<datalist id="cats">${[...new Set(menu.map((m) => m.category))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist>`
    : '<p class="muted">Меню пустое — добавьте первую позицию.</p>';
}
$("#menuList").addEventListener("input", (e) => {
  const row = e.target.closest(".mi"), k = e.target.dataset.k;
  if (!row || !k) return;
  const m = menu[row.dataset.i];
  m[k] = k === "available" ? e.target.checked : k === "price" ? Number(e.target.value) : e.target.value;
  if (k === "available") row.classList.toggle("off", !m.available);
  $("#menuStatus").textContent = "Есть несохранённые изменения";
});
$("#menuList").addEventListener("click", (e) => {
  const row = e.target.closest(".mi");
  if (!row) return;
  const i = Number(row.dataset.i);
  if (e.target.dataset.move) {
    const j = i + Number(e.target.dataset.move);
    if (j < 0 || j >= menu.length) return;
    [menu[i], menu[j]] = [menu[j], menu[i]];
  } else if (e.target.matches("[data-del]")) {
    if (!confirm(`Удалить «${menu[i].name || "позицию"}»?`)) return;
    menu.splice(i, 1);
  } else return;
  renderMenu();
  $("#menuStatus").textContent = "Есть несохранённые изменения";
});
$("#menuList").addEventListener("change", async (e) => {
  if (!e.target.matches("[data-img]") || !e.target.files[0]) return;
  const row = e.target.closest(".mi");
  $("#menuStatus").textContent = "Загружаем фото…";
  try {
    const { url } = await uploadImage(e.target.files[0], 900);
    menu[row.dataset.i].image = url;
    renderMenu();
    $("#menuStatus").textContent = "Фото загружено — не забудьте сохранить";
  } catch (ex) { $("#menuStatus").textContent = ex.message; }
});
$("#addItem").addEventListener("click", () => {
  menu.push({ id: "", name: "", category: menu.at(-1)?.category || "Комбо", description: "", price: 0, image: "", available: true });
  renderMenu();
  $("#menuList").lastElementChild.previousElementSibling?.scrollIntoView({ behavior: "smooth" });
});
$("#saveMenu").addEventListener("click", async () => {
  $("#menuStatus").textContent = "Сохраняем…";
  try {
    menu = await api("/admin/menu", { method: "PUT", body: JSON.stringify(menu) });
    renderMenu();
    $("#menuStatus").textContent = "Сохранено ✓";
  } catch (ex) { $("#menuStatus").textContent = ex.message; }
});

// Downscale photos in the browser so uploads stay small and fast on mobile data
async function uploadImage(file, maxSide) {
  let blob = file;
  if (!/svg|gif/.test(file.type)) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
    canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
    blob = await new Promise((r) => canvas.toBlob(r, file.type === "image/png" ? "image/png" : "image/jpeg", 0.85));
  }
  return api("/admin/images", { method: "POST", body: blob, headers: { "content-type": blob.type } });
}

/* ---------- Settings ---------- */
async function fillSettings() {
  try { settings = await api("/admin/settings"); } catch { return; }
  const f = $("#settingsForm").elements;
  f.acceptingOrders.checked = settings.acceptingOrders;
  for (const k of ["closedMessage", "deliveryFee", "minOrder", "qrNote", "whatsappTemplate"]) f[k].value = settings[k];
  $("#qrPreview").hidden = !settings.qrImage;
  if (settings.qrImage) $("#qrPreview").src = settings.qrImage;
  $("#settingsStatus").textContent = "";
}
$("#qrFile").addEventListener("change", async (e) => {
  if (!e.target.files[0]) return;
  $("#settingsStatus").textContent = "Загружаем QR…";
  try {
    // QR codes must stay sharp: keep PNG and a larger size
    const { url } = await uploadImage(e.target.files[0], 1200);
    settings.qrImage = url;
    $("#qrPreview").src = url;
    $("#qrPreview").hidden = false;
    $("#settingsStatus").textContent = "QR загружен — нажмите «Сохранить настройки»";
  } catch (ex) { $("#settingsStatus").textContent = ex.message; }
});
$("#settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target.elements;
  const body = {
    acceptingOrders: f.acceptingOrders.checked, closedMessage: f.closedMessage.value,
    deliveryFee: Number(f.deliveryFee.value), minOrder: Number(f.minOrder.value),
    qrImage: settings.qrImage, qrNote: f.qrNote.value, whatsappTemplate: f.whatsappTemplate.value,
  };
  try {
    settings = await api("/admin/settings", { method: "PUT", body: JSON.stringify(body) });
    $("#settingsStatus").textContent = "Сохранено ✓";
